<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athena — Q&A Search</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --border: #2a2a3a;
    --text: #e0e0e8;
    --muted: #8888a0;
    --accent: #c678dd;
    --accent2: #61afef;
    --green: #98c379;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 40px;
  }
  .logo {
    font-size: 2.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    letter-spacing: -1px;
  }
  .tagline {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 40px;
  }
  .search-box {
    width: 100%;
    max-width: 640px;
    position: relative;
    margin-bottom: 32px;
  }
  .search-box input {
    width: 100%;
    padding: 16px 20px 16px 48px;
    font-size: 1.1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(198, 120, 221, 0.15);
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-box svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    width: 20px;
    height: 20px;
  }
  .meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 16px;
    width: 100%;
    max-width: 640px;
  }
  .results {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .result {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: border-color 0.2s, transform 0.15s;
    cursor: default;
  }
  .result:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }
  .result-q {
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent2);
    line-height: 1.4;
  }
  .result-score {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--green);
    background: rgba(152, 195, 121, 0.1);
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .result-a {
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.5;
  }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .empty-text { font-size: 1rem; }
  .footer {
    margin-top: auto;
    padding-top: 60px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  @media (max-width: 480px) {
    body { padding: 32px 16px 24px; }
    .logo { font-size: 2rem; }
  }
</style>
</head>
<body>

<div class="logo">Athena</div>
<p class="tagline">Lightning-fast Q&A search</p>

<div class="search-box">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
  </svg>
  <input type="text" id="q" placeholder="Search your FAQ..." autofocus autocomplete="off">
</div>

<div class="meta" id="meta"></div>
<div class="results" id="results">
  <div class="empty">
    <div class="empty-icon">&#128269;</div>
    <div class="empty-text">Start typing to search</div>
  </div>
</div>

<div class="footer">
  Powered by <a href="https://github.com/akhil-datla/Athena">Athena</a>
</div>

<script>
const input = document.getElementById('q');
const results = document.getElementById('results');
const meta = document.getElementById('meta');
let debounce;

input.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(search, 150);
});

async function search() {
  const q = input.value.trim();
  if (!q) {
    results.innerHTML = '<div class="empty"><div class="empty-icon">&#128269;</div><div class="empty-text">Start typing to search</div></div>';
    meta.textContent = '';
    return;
  }
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&limit=20`);
    const data = await res.json();
    if (data.count === 0) {
      results.innerHTML = '<div class="empty"><div class="empty-icon">&#129300;</div><div class="empty-text">No results found</div></div>';
      meta.textContent = '';
      return;
    }
    meta.textContent = `${data.count} result${data.count !== 1 ? 's' : ''}`;
    results.innerHTML = data.results.map(r => {
      const pct = relevance(r.score, q);
      return `<div class="result">
        <div class="result-header">
          <div class="result-q">${esc(r.question)}</div>
          <div class="result-score">${pct}%</div>
        </div>
        <div class="result-a">${esc(r.answer)}</div>
      </div>`;
    }).join('');
  } catch {
    results.innerHTML = '<div class="empty"><div class="empty-text">Search failed</div></div>';
  }
}

function relevance(score, query) {
  const max = query.length * 2 || 1;
  return Math.max(0, Math.min(100, 100 - Math.round(score * 100 / max)));
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
